name: CI/CD Nightly + SCA
on:
  schedule:
    - cron: '55 0 * * *' # 20:55 America/La_Paz
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sca:
    name: Nightly SCA - Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar y probar
        run: mvn -B clean verify
      - name: Cache NVD
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-${{ runner.os }}-
      - name: Generar reportes SCA
        run: mvn -B dependency-check:check -Dformats=HTML,JSON -DossindexAnalyzerEnabled=false -DfailBuildOnCVSS=11
      - name: Quality Gate - leer reporte SCA
        run: python3 scripts/sca_gate.py target/dependency-check-report.json
      - name: Publicar reportes y aplicacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-sca-reports
          path: |
            target/dependency-check-report.*
            target/surefire-reports/
            target/*.jar
          retention-days: 14
      - name: Preparar entrega validada
        run: echo 'Aplicacion validada para entrega; el despliegue requiere un entorno configurado.'
